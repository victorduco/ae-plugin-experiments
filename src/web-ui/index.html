<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE Preview</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; height: 100%; }
  #app { height: 100%; display: flex; overflow: hidden; }

  /* ── video area ── */
  .stage {
    flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .stage.color-picker-active .videos-split,
  .stage.color-picker-active .videos-overlay,
  .stage.color-picker-active .videos-align,
  .stage.color-picker-active .video-wrap,
  .stage.color-picker-active .overlay-hit-area,
  .stage.color-picker-active .align-hit-area {
    cursor: crosshair !important;
  }

  /* menu icon — floats over video, doesn't take layout space */
  .menu-btn {
    position: absolute; top: 10px; right: 10px; z-index: 10;
    width: 30px; height: 30px; border-radius: 5px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    color: #888; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .menu-btn:hover { color: #ccc; }
  .tools-btn { top: 46px; }
  .tools-menu {
    position: absolute; top: 82px; right: 10px; z-index: 11; min-width: 170px;
    padding: 6px; border-radius: 8px; background: rgba(20,20,20,0.96);
    border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
  }
  .tools-menu button {
    width: 100%; padding: 8px 10px; border: 0; border-radius: 6px;
    background: transparent; color: #c8c8c8; text-align: left; cursor: pointer; font-size: 12px;
  }
  .tools-menu button:hover { background: rgba(255,255,255,0.07); }
  .tool-window {
    position: absolute; z-index: 20; width: 320px; min-height: 180px;
    border-radius: 12px; background: rgba(18,18,18,0.96); border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 22px 64px rgba(0,0,0,0.42), 0 4px 20px rgba(0,0,0,0.35);
    backdrop-filter: blur(12px); overflow: hidden;
  }
  .tool-window-header {
    padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border-bottom: 1px solid rgba(255,255,255,0.07); cursor: move; user-select: none;
  }
  .tool-window-title { font-size: 12px; color: #ddd; letter-spacing: 0.02em; }
  .tool-window-close {
    width: 22px; height: 22px; border-radius: 999px; border: 1px solid #3a3a3a;
    background: #202020; color: #8c8c8c; cursor: pointer; font-size: 12px;
  }
  .tool-window-close:hover { color: #ddd; background: #282828; }
  .tool-window-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .tool-window-actions {
    display: flex; justify-content: flex-end;
  }
  .ease-grid { display: grid; grid-template-columns: 1fr 56px; gap: 8px 10px; align-items: center; }
  .ease-row-label { font-size: 11px; color: #7a7a7a; }
  input[type="range"].ease-slider {
    width: 100%; accent-color: #4a88ff;
  }
  .ease-svg-wrap {
    height: 160px; padding: 10px; border-radius: 10px; background: #121418; border: 1px solid #2a2d33;
  }
  .ease-svg-wrap svg { width: 100%; height: 100%; display: block; }
  .ease-preview-box {
    height: 68px; border-radius: 10px; background: #121418; border: 1px solid #2a2d33;
    position: relative; overflow: hidden;
  }
  .ease-preview-title {
    position: absolute; left: 7px; top: 6px; font-size: 10px; color: #666; z-index: 1;
  }
  .ease-preview-dot {
    position: absolute; width: 10px; height: 10px; border-radius: 999px; background: #5ea1ff;
    top: 29px; left: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
  }
  .ease-preview-track {
    position: absolute; left: 8px; right: 8px; top: 33px; height: 2px; background: #2c3440;
  }
  .ease-handle {
    fill: #79a9ff; stroke: rgba(10,14,20,0.95); stroke-width: 2; cursor: grab;
  }
  .ease-handle.active { cursor: grabbing; }
  .color-picker-preview {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; border-radius: 10px; background: #121418; border: 1px solid #2a2d33;
  }
  .color-picker-swatch {
    width: 58px; height: 58px; border-radius: 12px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22);
  }
  .color-picker-preview-text {
    display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .color-picker-status {
    font-size: 12px; color: #ddd; line-height: 1.35;
  }
  .color-picker-meta {
    font-size: 11px; color: #6e7480; line-height: 1.35;
  }
  .color-picker-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .color-picker-value {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a2d33; background: #121418; color: #d7dbe3;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; text-align: left;
  }
  .color-picker-value:hover {
    border-color: #3b4554; background: #151920;
  }
  .color-picker-value-label {
    font-size: 11px; color: #7b8390; flex-shrink: 0;
  }
  .color-picker-value-text {
    font-size: 12px; color: #e7ebf2;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* split */
  .videos-split {
    flex: 1; display: grid; grid-template-rows: 1fr 1fr;
    gap: 1px; background: #1a1a1a; overflow: hidden; min-height: 0;
  }
  .video-cell { display: flex; flex-direction: row; background: #111; overflow: hidden; align-items: stretch; min-height: 0; }
  .video-wrap { position: relative; flex: 1; min-height: 0; min-width: 0; overflow: hidden; display: flex; }
  .video-wrap video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .video-wrap img.frame-preview { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .video-ended-overlay { position: absolute; background: #f00; pointer-events: none; }

  /* overlay */
  .videos-overlay,
  .videos-align {
    flex: 1; position: relative; overflow: hidden; min-height: 0; background: #000;
  }
  .videos-overlay video,
  .videos-align video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  }
  .videos-overlay img.frame-preview,
  .videos-align img.frame-preview {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block;
  }
  .videos-overlay video.on-top { opacity: 0.5; }
  .videos-overlay .video-ended-overlay { z-index: 2; }
  .videos-overlay .video-ended-overlay.on-top { opacity: 0.5; }
  .overlay-hit-area {
    position: absolute; inset: 0; z-index: 4; cursor: crosshair; user-select: none;
  }
  .overlay-measure {
    position: absolute; pointer-events: none; z-index: 5; overflow: visible; user-select: none;
  }
  .overlay-measure-line {
    stroke-linecap: round; stroke-linejoin: round;
  }
  .overlay-measure-label {
    position: absolute; z-index: 6; transform: translate(-50%, -50%);
    padding: 8px 12px; border-radius: 999px;
    background: rgba(22, 26, 33, 0.9); color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.45);
    font-size: 12px; line-height: 1; font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    backdrop-filter: blur(10px);
    white-space: nowrap; cursor: copy;
  }
  .overlay-measure-label:hover { background: rgba(32, 37, 46, 0.96); }
  .overlay-grid {
    position: absolute; pointer-events: none; z-index: 3; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55);
    user-select: none;
  }
  .overlay-grid-line-x,
  .overlay-grid-line-y {
    position: absolute; background: rgba(255,255,255,0.18);
  }
  .overlay-grid-line-x.major,
  .overlay-grid-line-y.major {
    background: rgba(255,255,255,0.32);
  }
  .overlay-grid-line-x.center,
  .overlay-grid-line-y.center {
    background: rgba(255,255,255,0.5);
  }
  .overlay-grid-line-x { top: 0; bottom: 0; width: 1px; transform: translateX(-0.5px); }
  .overlay-grid-line-y { left: 0; right: 0; height: 1px; transform: translateY(-0.5px); }
  .overlay-grid-label {
    position: absolute; font-size: 10px; line-height: 1; color: rgba(255,255,255,0.92);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    user-select: none;
  }
  .overlay-grid-label-x { top: 6px; transform: translateX(-50%); }
  .overlay-grid-label-y { left: 6px; transform: translateY(-50%); }
  .overlay-grid-badge {
    position: absolute; right: 8px; bottom: 8px; padding: 4px 6px;
    border-radius: 4px; background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.88);
    font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .align-layer {
    position: absolute; inset: 0; z-index: 1; will-change: transform;
  }
  .videos-align .video-ended-overlay { z-index: 1; }
  .align-hit-area {
    position: absolute; inset: 0; z-index: 3; user-select: none;
  }

  /* controls bar */
  .controls {
    flex-shrink: 0; background: #161616; border-top: 1px solid #1e1e1e;
    padding: 8px 14px; display: flex; align-items: center; gap: 10px;
  }
  .play-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid #333;
    background: #1e1e1e; color: #ccc; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .play-btn:hover { background: #252525; }
  .play-btn:disabled {
    background: #181818; color: #444; border-color: #2a2a2a; cursor: default;
  }
  .transport-btn {
    min-width: 38px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid #333;
    background: #1e1e1e; color: #888; cursor: pointer; font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .transport-btn:hover { background: #252525; color: #ccc; }
  .transport-btn:disabled {
    background: #181818; color: #444; border-color: #2a2a2a; cursor: default;
  }
  .scrubber { flex: 1; height: 3px; background: #2a2a2a; border-radius: 2px; cursor: pointer; }
  .scrubber-fill { height: 100%; background: #555; border-radius: 2px; pointer-events: none; }
  .scrubber:hover .scrubber-fill { background: #888; }
  .scrubber.locked { cursor: default; opacity: 0.55; }
  .scrubber.locked:hover .scrubber-fill { background: #555; }
  .time-lbl { font-size: 11px; color: #444; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .render-pill {
    flex-shrink: 0; padding: 4px 8px; border-radius: 999px; border: 1px solid #333;
    background: #1c1c1c; color: #888; font-size: 10px; line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .render-pill.rendering {
    color: #f0b85a; border-color: #6a4a10; background: #21180b;
  }
  .render-pill.error {
    color: #eb7474; border-color: #5a2020; background: #231212;
  }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #2a2a2a; font-size: 13px; }


  /* ── resize handle ── */
  .resizer {
    width: 4px; flex-shrink: 0; cursor: col-resize;
    background: #1e1e1e; transition: background 0.15s;
  }
  .resizer:hover, .resizer.dragging { background: #444; }

  /* ── sidebar ── */
  .sidebar {
    flex-shrink: 0; background: #161616; display: flex; flex-direction: column;
    overflow: hidden; border-left: 1px solid #222;
  }

  .sidebar-top {
    flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; min-height: 0;
  }

  .sidebar-bottom {
    padding: 10px 14px; border-top: 1px solid #222;
    display: flex; flex-direction: column; gap: 10px;
  }
  .timeline-row {
    display: flex; align-items: center; gap: 10px;
  }
  .transport-row {
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .lbl { font-size: 11px; color: #555; white-space: nowrap; }

  select {
    width: 100%; padding: 6px 10px; font-size: 13px;
    background: #1e1e1e; color: #eee; border: 1px solid #333;
    border-radius: 5px; outline: none; cursor: pointer;
  }
  select:focus { border-color: #555; }

  input[type="number"], input[type="text"] {
    width: 64px; padding: 5px 8px; font-size: 13px;
    background: #1e1e1e; color: #eee; border: 1px solid #333;
    border-radius: 5px; outline: none; font-family: inherit;
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: #555; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }

  .btn-group { display: flex; gap: 3px; flex-wrap: wrap; }
  .btn-group button {
    padding: 4px 9px; font-size: 12px; border-radius: 4px; border: 1px solid #333;
    background: #1e1e1e; color: #777; cursor: pointer; transition: all 0.1s;
  }
  .btn-group button.active { background: #2a2a2a; color: #eee; border-color: #555; }
  .btn-group.compact button { padding: 3px 8px; font-size: 11px; }
  .align-panel {
    padding: 10px; border-radius: 8px; background: #131313; border: 1px solid #262626;
    display: flex; flex-direction: column; gap: 10px;
  }
  .align-panel-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .align-panel-key {
    font-size: 11px; color: #676767; white-space: nowrap;
  }
  .align-video-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .align-video-row {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) 92px;
    gap: 8px; align-items: center;
  }
  .align-video-name {
    font-size: 11px; color: #bcbcbc; text-transform: lowercase;
  }
  .align-opacity {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .align-opacity input[type="range"] {
    flex: 1; min-width: 0; accent-color: #6d93ff;
  }
  .align-opacity-value {
    width: 38px; text-align: right; font-size: 11px; color: #7d7d7d;
    font-variant-numeric: tabular-nums;
  }
  .align-filter-select {
    width: 92px; padding: 4px 8px; font-size: 11px;
    background: #1d1d1d; color: #ddd; border: 1px solid #333; border-radius: 5px;
  }

  .sep-h { height: 1px; background: #222; }

  .set-time-btn {
    padding: 3px 7px; font-size: 11px; border-radius: 4px; border: 1px solid #333;
    background: #1e1e1e; color: #555; cursor: pointer; white-space: nowrap;
    transition: color 0.1s, border-color 0.1s;
  }
  .set-time-btn:hover { color: #aaa; border-color: #555; }
  .open-aep-btn {
    padding: 4px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #333;
    background: #1b1b1b; color: #666; cursor: pointer; white-space: nowrap;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  .open-aep-btn:hover { color: #bbb; border-color: #555; background: #202020; }
  .open-aep-btn:disabled { color: #444; border-color: #2a2a2a; cursor: default; background: #181818; }

  .render-open-btn {
    padding: 4px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #333;
    background: #1b1b1b; color: #666; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  .render-open-btn:hover { color: #bbb; border-color: #555; background: #202020; }
  .render-open-btn:disabled { color: #444; border-color: #2a2a2a; cursor: default; background: #181818; }
  .render-open-btn.running { color: #f0a030; border-color: #6a4a10; }
  .render-open-btn.done { color: #50c050; border-color: #2a5a2a; }
  .render-open-btn.error { color: #e04040; border-color: #5a2020; }
  .open-project-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 0;
  }
  .open-project-name {
    flex: 1; min-width: 0; font-size: 11px; color: #999;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .open-project-name.active { color: #ddd; }

  .tc-input {
    width: 40px; padding: 5px 8px; font-size: 13px;
    background: #1e1e1e; color: #eee; border: 1px solid #333;
    border-radius: 5px; outline: none; font-family: inherit; text-align: center;
  }
  .tc-input:focus { border-color: #555; }
  .tc-sep { font-size: 13px; color: #444; }
</style>
</head>
<body>
<div id="app">
  <div class="stage" :class="{ 'color-picker-active': colorPickerActive }">
    <template v-if="videoName">
      <!-- SPLIT -->
      <div v-if="mode === 'split'" class="videos-split">
        <div class="video-cell">
          <div class="video-wrap">
            <img v-if="showFramePreview" ref="lastFrameImage" class="frame-preview" :key="frameSrc" :src="frameSrc"
                 @load="onLastFrameLoaded" />
            <video v-else ref="lastVideo" :key="lastSrc" :src="lastSrc" muted
                   @loadedmetadata="onLastLoaded" @timeupdate="onLastTime"></video>
            <div v-if="lastEnded" class="video-ended-overlay" :style="lastEndedStyle"></div>
          </div>
        </div>
        <div class="video-cell">
          <div class="video-wrap">
            <video ref="refVideo" :key="refKey" :src="refSrc" muted
                   @loadedmetadata="onRefLoaded"></video>
            <div v-if="refEnded" class="video-ended-overlay" :style="refEndedStyle"></div>
          </div>
        </div>
      </div>

      <!-- OVERLAY -->
      <div v-else-if="mode === 'overlay'" class="videos-overlay">
        <img v-if="showFramePreview" ref="lastFrameImage" class="frame-preview" :key="frameSrc" :src="frameSrc"
             @load="onLastFrameLoaded" />
        <video v-else ref="lastVideo" :key="lastSrc" :src="lastSrc" muted
               @loadedmetadata="onLastLoaded" @timeupdate="onLastTime"></video>
        <div v-if="lastEnded" class="video-ended-overlay" :style="lastEndedStyle"></div>
        <video ref="refVideo" :key="refKey" :src="refSrc" muted class="on-top"
               @loadedmetadata="onRefLoaded" @timeupdate="onRefTime"></video>
        <div v-if="refEnded" class="video-ended-overlay on-top" :style="refEndedStyle"></div>
        <div v-if="!renderPreviewLocked" class="overlay-hit-area" @pointerdown="onOverlayPointerDown"></div>
        <div v-if="showGrid && overlayGrid" class="overlay-grid" :style="overlayGrid.style">
          <div v-for="line in overlayGrid.verticalLines" :key="`vx-${line.value}`"
               class="overlay-grid-line-x" :class="{ major: line.major, center: line.center }"
               :style="{ left: line.pos + '%' }"></div>
          <div v-for="line in overlayGrid.horizontalLines" :key="`hy-${line.value}`"
               class="overlay-grid-line-y" :class="{ major: line.major, center: line.center }"
               :style="{ top: line.pos + '%' }"></div>
          <div v-for="label in overlayGrid.xLabels" :key="`xl-${label.value}`"
               class="overlay-grid-label overlay-grid-label-x"
               :style="{ left: label.pos + '%' }">{{ label.text }}</div>
          <div v-for="label in overlayGrid.yLabels" :key="`yl-${label.value}`"
               class="overlay-grid-label overlay-grid-label-y"
               :style="{ top: label.pos + '%' }">{{ label.text }}</div>
          <div class="overlay-grid-badge">{{ overlayGrid.badge }}</div>
        </div>
        <svg v-if="overlayMeasurement" class="overlay-measure" :style="overlayMeasurement.style"
             :viewBox="`0 0 ${overlayMeasurement.width} ${overlayMeasurement.height}`"
             preserveAspectRatio="none">
          <line class="overlay-measure-line"
                :x1="overlayMeasurement.x1" :y1="overlayMeasurement.y1"
                :x2="overlayMeasurement.x2" :y2="overlayMeasurement.y2"
                stroke="rgba(0,0,0,0.95)" stroke-width="6"></line>
          <line class="overlay-measure-line"
                :x1="overlayMeasurement.x1" :y1="overlayMeasurement.y1"
                :x2="overlayMeasurement.x2" :y2="overlayMeasurement.y2"
                stroke="#2f80ff" stroke-width="4"></line>
        </svg>
        <button v-if="overlayMeasurement"
             type="button"
             class="overlay-measure-label"
             @pointerdown.stop
             @mousedown.prevent
             @click.stop="copyMeasurementValue"
             :style="{ left: overlayMeasurement.labelLeft + 'px', top: overlayMeasurement.labelTop + 'px' }">
          {{ overlayMeasurement.text }}
        </button>
      </div>

      <!-- ALIGN -->
      <div v-else class="videos-align">
        <div class="align-layer" :style="alignLayerStyle('last')">
          <img v-if="showFramePreview" ref="lastFrameImage" class="frame-preview" :key="frameSrc" :src="frameSrc"
               @load="onLastFrameLoaded" />
          <video v-else ref="lastVideo" :key="lastSrc" :src="lastSrc" muted
                 @loadedmetadata="onLastLoaded" @timeupdate="onLastTime"></video>
          <div v-if="lastEnded" class="video-ended-overlay" :style="lastEndedStyle"></div>
        </div>
        <div class="align-layer" :style="alignLayerStyle('ref')">
          <video ref="refVideo" :key="refKey" :src="refSrc" muted
                 @loadedmetadata="onRefLoaded" @timeupdate="onRefTime"></video>
          <div v-if="refEnded" class="video-ended-overlay" :style="refEndedStyle"></div>
        </div>
        <div v-if="!renderPreviewLocked" class="align-hit-area"
             :style="{ cursor: alignDragging ? 'grabbing' : 'grab' }"
             @pointerdown.prevent="onAlignPointerDown"></div>
      </div>

    </template>

    <div class="empty" v-else>select a project</div>

    <div v-for="win in toolWindows" :key="win.id" class="tool-window"
         :style="{ left: win.x + 'px', top: win.y + 'px' }"
         @mousedown="focusToolWindow(win.id)">
      <div class="tool-window-header" @mousedown.prevent="startToolWindowDrag($event, win.id)">
        <div class="tool-window-title">{{ win.title }}</div>
        <button class="tool-window-close" @click.stop="closeToolWindow(win.id)">×</button>
      </div>
      <div class="tool-window-body" v-if="win.type === 'ease-visualizer'">
        <div class="tool-window-actions">
          <button class="open-aep-btn" @click="copyEaseValues">copy values</button>
        </div>
        <div class="ease-svg-wrap">
          <svg viewBox="0 0 220 128" preserveAspectRatio="xMidYMid meet"
               @pointerdown="onEaseGraphPointerDown">
            <path d="M12 116 L208 116 M12 116 L12 12" stroke="#2a2e35" stroke-width="1.2" fill="none"></path>
            <path d="M12 64 L208 64 M110 116 L110 12" stroke="#20242b" stroke-width="1" fill="none"></path>
            <path :d="easeGraph.handlePath" stroke="#395784" stroke-width="1.2" fill="none" stroke-dasharray="4 4"></path>
            <circle :cx="easeGraph.cp1.x" :cy="easeGraph.cp1.y" r="5.5"
                    class="ease-handle" :class="{ active: easeDragHandle === 'cp1' }"
                    @pointerdown.stop="startEaseHandleDrag($event, 'cp1')"></circle>
            <circle :cx="easeGraph.cp2.x" :cy="easeGraph.cp2.y" r="5.5"
                    class="ease-handle" :class="{ active: easeDragHandle === 'cp2' }"
                    @pointerdown.stop="startEaseHandleDrag($event, 'cp2')"></circle>
            <path :d="easeGraph.curvePath" stroke="#7fb0ff" stroke-width="3" fill="none" stroke-linecap="round"></path>
          </svg>
        </div>

        <div class="ease-grid">
          <div>
            <div class="ease-row-label">In Influence</div>
          </div>
          <input type="number" min="0" max="100" step="1" v-model.number="easeTool.inX" />
          <div>
            <div class="ease-row-label">In Speed</div>
          </div>
          <input type="number" min="0" max="100" step="1" v-model.number="easeTool.inY" />
          <div>
            <div class="ease-row-label">Out Influence</div>
          </div>
          <input type="number" min="0" max="100" step="1" v-model.number="easeTool.outX" />
          <div>
            <div class="ease-row-label">Out Speed</div>
          </div>
          <input type="number" min="0" max="100" step="1" v-model.number="easeTool.outY" />
          <div>
            <div class="ease-row-label">Duration</div>
          </div>
          <input type="number" min="50" max="10000" step="10" v-model.number="easeTool.duration" />
        </div>

        <div class="ease-preview-box" @click="replayEasePreview">
          <div class="ease-preview-title">Move</div>
          <div class="ease-preview-track"></div>
          <div class="ease-preview-dot"
               :key="easePreview.runId"
               :style="easePreview.dotStyle"></div>
        </div>
      </div>
      <div class="tool-window-body" v-else-if="win.type === 'color-picker'">
        <div class="color-picker-preview">
          <div class="color-picker-swatch" :style="{ background: colorPickerTool.hex }"></div>
          <div class="color-picker-preview-text">
            <div class="color-picker-status">{{ colorPickerTool.status }}</div>
            <div class="color-picker-meta">{{ colorPickerTool.meta }}</div>
          </div>
        </div>
        <div class="color-picker-list">
          <button class="color-picker-value" @click="copyColorPickerValue('ae')">
            <span class="color-picker-value-label">AE RGB</span>
            <span class="color-picker-value-text">{{ colorPickerTool.ae }}</span>
          </button>
          <button class="color-picker-value" @click="copyColorPickerValue('hex')">
            <span class="color-picker-value-label">Hex</span>
            <span class="color-picker-value-text">{{ colorPickerTool.hex }}</span>
          </button>
          <button class="color-picker-value" @click="copyColorPickerValue('rgb')">
            <span class="color-picker-value-label">RGB</span>
            <span class="color-picker-value-text">{{ colorPickerTool.rgb }}</span>
          </button>
        </div>
      </div>
    </div>
    <button class="menu-btn" @click="sidebarOpen = !sidebarOpen">☰</button>
    <button class="menu-btn tools-btn" @click.stop="toolsMenuOpen = !toolsMenuOpen">⚙</button>
    <div v-if="toolsMenuOpen" class="tools-menu">
      <button @click="openToolWindow('ease-visualizer')">Ease Visualizer</button>
      <button @click="openToolWindow('color-picker')">Color Picker</button>
    </div>
  </div>

  <!-- resize handle + sidebar -->
  <template v-if="sidebarOpen">
    <div class="resizer" :class="{ dragging: resizing }" @mousedown="onResizerDown"></div>
    <div class="sidebar" :style="{ width: sidebarWidth + 'px' }">
      <div class="sidebar-top">
        <div class="field">
          <div class="lbl">project</div>
          <div class="field-row">
            <select v-model="selected" style="flex:1; min-width:0;">
              <option disabled value="">Select…</option>
              <optgroup v-if="pairs.length" label="rendered pairs">
                <option v-for="p in pairs" :key="p" :value="p">{{ p }}</option>
              </optgroup>
              <optgroup v-if="openProjects.length" label="open in ae">
                <option v-for="proj in openProjects" :key="'open:'+proj.path" :value="'open:'+proj.path">{{ proj.name }}</option>
              </optgroup>
            </select>
            <button class="open-aep-btn" :disabled="!pairName" @click="openAeProject">open ae</button>
          </div>
        </div>

        <template v-if="isOpenProject">
          <div class="sep-h"></div>
          <div class="field">
            <div class="field-row" style="gap:5px; align-items:center;">
              <button
                class="render-open-btn"
                :disabled="currentOpenRenderStatus === 'running'"
                @click="renderCurrentOpenProject"
                style="flex:1">
                {{ currentOpenRenderLabel }}
              </button>
              <button class="render-open-btn" @click="toggleAutoRender" style="flex-shrink:0">
                {{ autoRender ? 'auto on' : 'auto' }}
              </button>
            </div>
            <div v-if="lastRenderLabel" class="lbl" style="margin-top:3px">{{ lastRenderLabel }}</div>
          </div>
        </template>

        <div class="sep-h"></div>

        <div class="field">
          <div class="lbl">view</div>
          <div class="btn-group">
            <button :class="{ active: mode === 'split' }"   @click="setMode('split')">split</button>
            <button :class="{ active: mode === 'overlay' }" @click="setMode('overlay')">overlay</button>
            <button :class="{ active: mode === 'align' }"   @click="setMode('align')">align</button>
          </div>
        </div>

        <template v-if="mode === 'align'">
          <div class="sep-h"></div>
          <div class="field">
            <div class="lbl">align</div>
            <div class="align-panel">
              <div class="align-panel-row">
                <div class="align-panel-key">drag</div>
                <div class="btn-group compact">
                  <button :class="{ active: alignTarget === 'last' }" @click="setAlignTarget('last')">last</button>
                  <button :class="{ active: alignTarget === 'ref' }" @click="setAlignTarget('ref')">ref</button>
                </div>
              </div>
              <div class="align-panel-row">
                <div class="align-panel-key">top</div>
                <div class="btn-group compact">
                  <button :class="{ active: alignTopLayer === 'last' }" @click="setAlignTopLayer('last')">last</button>
                  <button :class="{ active: alignTopLayer === 'ref' }" @click="setAlignTopLayer('ref')">ref</button>
                </div>
              </div>
              <div class="align-video-list">
                <div v-for="layer in alignLayers" :key="layer.id" class="align-video-row">
                  <div class="align-video-name">{{ layer.label }}</div>
                  <div class="align-opacity">
                    <input type="range" min="0" max="100" step="1"
                           :value="alignOpacity[layer.id]"
                           @input="setAlignOpacity(layer.id, $event.target.value)" />
                    <div class="align-opacity-value">{{ alignOpacity[layer.id] }}%</div>
                  </div>
                  <select class="align-filter-select"
                          :value="alignFilter[layer.id]"
                          @change="setAlignFilter(layer.id, $event.target.value)">
                    <option v-for="filter in alignFilterOptions" :key="filter.id" :value="filter.id">{{ filter.label }}</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </template>

        <div v-if="mode === 'overlay'" class="sep-h"></div>

        <div v-if="mode === 'overlay'" class="field">
          <div class="lbl">grid</div>
          <div class="btn-group">
            <button :class="{ active: showGrid }" @click="showGrid = true">on</button>
            <button :class="{ active: !showGrid }" @click="showGrid = false">off</button>
          </div>
        </div>

        <div class="sep-h"></div>

        <div class="field">
          <div class="lbl">ref trim start</div>
          <div class="field-row">
            <input class="tc-input" type="number" min="0" step="1"
                   :value="tcSec(trimStart)"
                   @change="e => trimStart = tcToSec(+e.target.value, tcFr(trimStart))"
                   @blur="e => e.target.value = tcSec(trimStart)" />
            <span class="tc-sep">s</span>
            <input class="tc-input" type="number" min="0" :max="FPS-1" step="1"
                   :value="tcFr(trimStart)"
                   @change="e => trimStart = tcToSec(tcSec(trimStart), Math.min(+e.target.value, FPS-1))"
                   @blur="e => e.target.value = tcFr(trimStart)" />
            <span class="tc-sep">f</span>
            <button class="set-time-btn" @click="setTrimStart" title="set to current time">↙ now</button>
          </div>
        </div>

        <div class="sep-h"></div>

        <div class="field">
          <div class="lbl">ref trim duration</div>
          <div class="field-row">
            <input class="tc-input" type="number" min="0" step="1"
                   :value="trimDur != null ? tcSec(trimDur) : ''"
                   @change="e => trimDur = tcToSec(+e.target.value, trimDur != null ? tcFr(trimDur) : 0)"
                   @blur="e => e.target.value = trimDur != null ? tcSec(trimDur) : ''"
                   placeholder="∞" />
            <span class="tc-sep">s</span>
            <input class="tc-input" type="number" min="0" :max="FPS-1" step="1"
                   :value="trimDur != null ? tcFr(trimDur) : ''"
                   @change="e => { if (trimDur == null) trimDur = 0; trimDur = tcToSec(tcSec(trimDur), Math.min(+e.target.value, FPS-1)); }"
                   @blur="e => e.target.value = trimDur != null ? tcFr(trimDur) : ''"
                   placeholder="∞" />
            <span class="tc-sep">f</span>
            <button class="set-time-btn" @click="setTrimDur" title="set so current frame is last">↙ now</button>
          </div>
        </div>

        <div class="sep-h"></div>

        <div class="field">
          <div class="lbl">speed</div>
          <div class="btn-group">
            <button v-for="s in speeds" :key="s" :class="{ active: speed === s }" @click="setSpeed(s)">{{ s }}x</button>
          </div>
        </div>

        <div class="sep-h"></div>

        <div class="field">
          <div class="lbl">seek step (← →)</div>
          <div class="field-row">
            <input type="number" v-model.number="seekStepFrames" min="1" step="1" style="width:80px" />
            <span class="lbl">frames</span>
          </div>
        </div>
      </div>

      <div class="sidebar-bottom">
        <div class="timeline-row">
          <span class="time-lbl">{{ fmtTime(currentTime) }}</span>
          <div class="scrubber" :class="{ locked: renderPreviewLocked }" @mousedown="onScrubStart">
            <div class="scrubber-fill" :style="{ width: progressPct + '%' }"></div>
          </div>
          <span v-if="renderStatusBadge" class="render-pill" :class="renderStatusBadge.tone">{{ renderStatusBadge.text }}</span>
          <span class="time-lbl">{{ fmtTime(duration) }}</span>
        </div>
        <div class="transport-row">
          <button class="play-btn" :disabled="renderPreviewLocked" @click="togglePlay">{{ playing ? '⏸' : '▶' }}</button>
          <button class="transport-btn" :disabled="renderPreviewLocked" @click="goToStart">0</button>
          <button class="transport-btn" :disabled="renderPreviewLocked" @click="seekFrames(-seekStepFrames)">←{{ seekStepFrames }}f</button>
          <button class="transport-btn" :disabled="renderPreviewLocked" @click="seekFrames(-1)">←1f</button>
          <button class="transport-btn" :disabled="renderPreviewLocked" @click="seekFrames(1)">1f→</button>
          <button class="transport-btn" :disabled="renderPreviewLocked" @click="seekFrames(seekStepFrames)">{{ seekStepFrames }}f→</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted } = Vue;
const FPS = 60;
const ALIGN_EFFECTS = {
  normal: { filter: "none", blendMode: "normal" },
  screen: { filter: "none", blendMode: "screen" },
  invert: { filter: "invert(1)", blendMode: "normal" },
  mono: { filter: "grayscale(1) contrast(1.08)", blendMode: "normal" },
  cool: { filter: "grayscale(1) sepia(1) saturate(4) hue-rotate(165deg) brightness(1.05)", blendMode: "normal" },
  warm: { filter: "sepia(1) saturate(4.6) hue-rotate(-18deg) brightness(1.05)", blendMode: "normal" },
};

const LS = {
  get(k, def) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v)   { localStorage.setItem(k, JSON.stringify(v)); }
};

createApp({
  setup() {
    const pairs       = ref([]);
    const openProjects = ref([]);
    const selectedOpenProject = ref("");
    const openProjectComps = ref([]);
    const selectedOpenComp = ref("");
    const openRenderJobs = reactive({}); // path → { status, outputName }
    const openRenderedComp = ref(""); // comp name used in last render (drives lastSrc/refSrc)
    const autoRender = ref(true);
    const lastRenderTime = ref(null); // Date or null
    const now = ref(Date.now());
    setInterval(() => { now.value = Date.now(); }, 15000);
    const lastRenderLabel = computed(() => {
      if (!lastRenderTime.value) return "";
      const mins = Math.round((now.value - lastRenderTime.value.getTime()) / 60000);
      if (mins < 1) return "just now";
      return `${mins} min ago`;
    });
    let autoRenderTimer = null;
    const renderPollTimers = new Map();
    const selected    = ref(LS.get("selected", ""));
    const trimStart   = ref(LS.get("trimStart", 0));
    const trimDur     = ref(LS.get("trimDur", null));
    const trimEnd     = computed(() => trimDur.value ? trimStart.value + trimDur.value : null);
    const speeds      = [0.1, 0.25, 0.5, 0.75, 1];
    const legacySeekStep = LS.get("seekStep", null);
    const seekStepFrames = ref(LS.get("seekStepFrames",
      Number.isFinite(legacySeekStep) ? Math.max(1, Math.round(legacySeekStep * FPS)) : 30
    ));
    const speed       = ref(LS.get("speed", 1));
    const savedMode   = LS.get("mode", "split");
    const mode        = ref(["split", "overlay", "align"].includes(savedMode) ? savedMode : "split");
    const showGrid    = ref(LS.get("showGrid", true));
    const sidebarOpen = ref(LS.get("sidebarOpen", true));
    const sidebarWidth = ref(LS.get("sidebarWidth", 260));
    const resizing    = ref(false);
    const ts          = ref(Date.now());
    const toolsMenuOpen = ref(false);
    const toolWindows = ref([]);
    const easeTool = reactive({
      inX: 33,
      inY: 0,
      outX: 67,
      outY: 100,
      duration: 1200,
    });
    const colorPickerTool = reactive({
      hex: "#000000",
      rgb: "rgb(0, 0, 0)",
      ae: "[0, 0, 0]",
      status: "click on the preview to sample",
      meta: "copies AE RGB on click; close the window to stop",
    });
    const easePreviewRun = ref(0);
    const easePreviewActive = ref(false);

    const lastVideo   = ref(null);
    const lastFrameImage = ref(null);
    const refVideo    = ref(null);
    const videoStage  = ref(null);
    const playing     = ref(false);
    const currentTime = ref(0);
    const lastDur     = ref(0);
    const refNatDur   = ref(0);  // natural duration of ref file
    const lastEnded   = ref(false);
    const refEnded    = ref(false);
    const lastEndedStyle = ref({});
    const refEndedStyle  = ref({});
    const layoutVersion = ref(0);
    const overlayMeasure = ref(null);
    const alignLayers = [
      { id: "last", label: "last" },
      { id: "ref", label: "ref" },
    ];
    const alignFilterOptions = [
      { id: "normal", label: "normal" },
      { id: "screen", label: "screen" },
      { id: "invert", label: "invert" },
      { id: "mono", label: "mono" },
      { id: "cool", label: "cool" },
      { id: "warm", label: "warm" },
    ];
    const alignTarget = ref(LS.get("alignTarget", "ref"));
    const alignTopLayer = ref(LS.get("alignTopLayer", "ref"));
    const savedAlignOpacity = LS.get("alignOpacity", { last: 100, ref: 50 });
    const alignOpacity = reactive({
      last: savedAlignOpacity.last ?? 100,
      ref: savedAlignOpacity.ref ?? 50,
    });
    const savedAlignFilter = LS.get("alignFilter", { last: "normal", ref: "normal" });
    const alignFilter = reactive({
      last: savedAlignFilter.last ?? "normal",
      ref: savedAlignFilter.ref ?? "normal",
    });
    const savedAlignOffsets = LS.get("alignOffsets", { last: { x: 0, y: 0 }, ref: { x: 0, y: 0 } });
    const alignOffsets = reactive({
      last: { x: savedAlignOffsets?.last?.x ?? 0, y: savedAlignOffsets?.last?.y ?? 0 },
      ref: { x: savedAlignOffsets?.ref?.x ?? 0, y: savedAlignOffsets?.ref?.y ?? 0 },
    });
    const alignDrag = ref(null);
    const alignDragging = computed(() => !!alignDrag.value);
    let nextToolWindowId = 1;
    let toolDrag = null;
    const easeDragHandle = ref(null);
    const colorPickerActive = computed(() => toolWindows.value.some(w => w.type === "color-picker"));

    function getSavedTimelineMap() {
      return LS.get("timelineByProject", {});
    }
    function getSavedTimeline(name) {
      if (!name) return 0;
      const map = getSavedTimelineMap();
      return Number.isFinite(map[name]) ? map[name] : 0;
    }
    function saveTimeline(name, t) {
      if (!name) return;
      const map = getSavedTimelineMap();
      map[name] = snapToFrame(Math.max(0, t || 0));
      LS.set("timelineByProject", map);
    }

    function mediaSize(el) {
      if (!el) return { width: 0, height: 0 };
      return {
        width: el.videoWidth || el.naturalWidth || 0,
        height: el.videoHeight || el.naturalHeight || 0,
      };
    }

    function mediaContainRect(el) {
      if (!el) return {};
      const cw = el.clientWidth, ch = el.clientHeight;
      const { width: vw, height: vh } = mediaSize(el);
      if (!vw || !vh) return { left: 0, top: 0, width: cw + 'px', height: ch + 'px' };
      const scale = Math.min(cw / vw, ch / vh);
      const rw = vw * scale, rh = vh * scale;
      return {
        left:   Math.round((cw - rw) / 2) + 'px',
        top:    Math.round((ch - rh) / 2) + 'px',
        width:  Math.round(rw) + 'px',
        height: Math.round(rh) + 'px',
      };
    }

    function updateEndedStyles() {
      if (lastEnded.value) lastEndedStyle.value = mediaContainRect(lastVideo.value);
      if (refEnded.value)  refEndedStyle.value  = mediaContainRect(refVideo.value);
      layoutVersion.value += 1;
    }

    const isOpenProject = computed(() => selected.value.startsWith("open:"));
    const pairName = computed(() => isOpenProject.value ? "" : selected.value);
    const openProjectPath = computed(() => isOpenProject.value ? selected.value.slice(5) : "");
    const currentOpenRenderJob = computed(() => openRenderJobs[openProjectPath.value] || null);
    const openOutputName = computed(() => currentOpenRenderJob.value?.outputName || openRenderedComp.value);
    const videoName = computed(() => pairName.value || openOutputName.value);
    const lastSrc = computed(() => videoName.value ? `/output/${videoName.value}_last.mp4?t=${ts.value}` : "");
    const refSrc  = computed(() => videoName.value ? `/output/${videoName.value}_ref.mp4?t=${ts.value}` : "");
    const refKey  = computed(() => `${refSrc.value}-${trimStart.value}-${trimDur.value}`);
    const frameSrc = computed(() => {
      const framePath = currentOpenRenderJob.value?.framePath;
      return framePath ? `${framePath}?t=${ts.value}` : "";
    });
    const showFramePreview = computed(() => !!(
      isOpenProject.value &&
      currentOpenRenderJob.value?.frameReady &&
      currentOpenRenderJob.value?.status !== "done"
    ));
    const renderPreviewLocked = computed(() => !!(
      isOpenProject.value &&
      currentOpenRenderJob.value?.status === "running" &&
      currentOpenRenderJob.value?.frameReady
    ));
    const renderStatusBadge = computed(() => {
      if (!isOpenProject.value) return null;
      const job = currentOpenRenderJob.value;
      if (!job) return null;
      if (job.status === "running" && job.stage === "build") {
        return { tone: "rendering", text: "building" };
      }
      if (job.status === "running" && !job.frameReady) {
        return { tone: "rendering", text: job.stage === "frame_rendering" ? "rendering frame" : "rendering" };
      }
      if (job.status === "running" && job.frameReady) {
        return { tone: "rendering", text: "frame ready / video render" };
      }
      if (job.status === "error") {
        return { tone: "error", text: "render error" };
      }
      return null;
    });
    const lastPreviewMedia = computed(() => showFramePreview.value ? lastFrameImage.value : lastVideo.value);

    // effective ref duration = trimDur if set, else natural duration minus trimStart
    const refEffDur = computed(() => {
      if (!refNatDur.value) return 0;
      if (trimDur.value) return trimDur.value;
      return Math.max(0, refNatDur.value - trimStart.value);
    });

    // total timeline = longest of the two sources
    const duration    = computed(() => Math.max(lastDur.value, refEffDur.value));
    const progressPct = computed(() => duration.value ? (currentTime.value / duration.value) * 100 : 0);
    const overlayViewport = computed(() => {
      layoutVersion.value;
      const primaryMedia = mediaSize(lastPreviewMedia.value).width ? lastPreviewMedia.value
        : (mediaSize(refVideo.value).width ? refVideo.value : null);
      if (!primaryMedia) return null;

      const { width: videoW, height: videoH } = mediaSize(primaryMedia);
      if (!videoW || !videoH) return null;

      const rect = mediaContainRect(primaryMedia);
      const widthPx = parseFloat(rect.width);
      const heightPx = parseFloat(rect.height);
      const leftPx = parseFloat(rect.left);
      const topPx = parseFloat(rect.top);
      if (!widthPx || !heightPx) return null;

      return {
        videoW, videoH, widthPx, heightPx, leftPx, topPx,
        style: rect,
      };
    });
    const overlayGrid = computed(() => {
      const viewport = overlayViewport.value;

      alignDrag.value = {
        target,
        startX: e.clientX,
        startY: e.clientY,
        originX: offset.x,
        originY: offset.y,
      };
      window.addEventListener("pointermove", onAlignPointerMove);
      window.addEventListener("pointerup", stopAlignDrag);
    }
    function applySpeed(v) { if (v) v.playbackRate = speed.value; }
    function syncRef() {} // kept for compat, logic moved to applyMasterTime

    function tcFrames(s) { return Math.max(0, Math.round((s || 0) * FPS)); }
    // seconds → whole seconds part
    function tcSec(s) { return Math.floor(tcFrames(s) / FPS); }
    // seconds → frames part (0..FPS-1)
    function tcFr(s)  { return tcFrames(s) % FPS; }
    // whole secs + frames → seconds
    function tcToSec(s, f) { return Math.max(0, s) + Math.max(0, Math.min(f, FPS - 1)) / FPS; }
    // snap raw seconds to nearest frame
    function snapToFrame(s) { return Math.round(s * FPS) / FPS; }
    const FRAME_SYNC_EPSILON = 0.5 / FPS;

    function setTrimStart() {
      trimStart.value = snapToFrame(masterTime);
    }
    function setTrimDur() {
      const d = snapToFrame(masterTime - trimStart.value);
      trimDur.value = d > 0 ? d : 0;
    }

    // masterTime: 0..totalDuration, drives both videos and the scrubber
    let masterTime = 0;
    let rafId = null;
    let lastRafTs = null;

    function restorePlaybackPosition() {
      if (!selected.value) return;
      const total = duration.value;
      const saved = getSavedTimeline(selected.value);
      const t = snapToFrame(total > 0 ? Math.min(saved, total) : saved);
      applyMasterTime(t);
    }

    function applyMasterTime(t) {
      masterTime = t;
      currentTime.value = t;

      const lv = lastVideo.value;
      const rv = refVideo.value;

      // --- last video ---
      if (lv && lastDur.value > 0) {
        if (t >= lastDur.value) {
          if (!lastEnded.value) {
            lv.pause(); lastEnded.value = true;
            lastEndedStyle.value = mediaContainRect(lv);
          }
        } else {
          if (lastEnded.value) {
            lastEnded.value = false;
            lv.currentTime = t;
          } else if (Math.abs(lv.currentTime - t) > FRAME_SYNC_EPSILON) {
            lv.currentTime = t;
          }
        }
      }

      // --- ref video ---
      if (rv && refEffDur.value > 0) {
        if (t >= refEffDur.value) {
          if (!refEnded.value) {
            rv.pause(); refEnded.value = true;
            refEndedStyle.value = mediaContainRect(rv);
          }
        } else {
          const refPos = trimStart.value + t;
          if (refEnded.value) {
            refEnded.value = false;
            rv.currentTime = refPos;
          } else if (Math.abs(rv.currentTime - refPos) > FRAME_SYNC_EPSILON) {
            rv.currentTime = refPos;
          }
        }
      }
    }

    let looping = false;

    function doLoop() {
      looping = true;
      lastEnded.value = false;
      refEnded.value = false;
      masterTime = 0;
      currentTime.value = 0;

      const lv = lastVideo.value;
      const rv = refVideo.value;
      let lvReady = !lv || lastDur.value <= 0;
      let rvReady = !rv || refEffDur.value <= 0;

      function tryStart() {
        if (!lvReady || !rvReady) return;
        looping = false;
        lastRafTs = null;
        if (lv) lv.play().catch(() => {});
        if (rv) rv.play().catch(() => {});
      }

      if (lv && lastDur.value > 0) {
        lv.pause();
        const onSeeked = () => { lv.removeEventListener("seeked", onSeeked); lvReady = true; tryStart(); };
        lv.addEventListener("seeked", onSeeked);
        lv.currentTime = 0;
      }
      if (rv && refEffDur.value > 0) {
        rv.pause();
        const onSeeked = () => { rv.removeEventListener("seeked", onSeeked); rvReady = true; tryStart(); };
        rv.addEventListener("seeked", onSeeked);
        rv.currentTime = trimStart.value;
      }
      tryStart();
    }

    function rafTick(ts) {
      if (!looping) {
        if (lastRafTs !== null) {
          const dt = (ts - lastRafTs) / 1000 * speed.value;
          const total = duration.value;
          if (total > 0) {
            let next = masterTime + dt;
            if (next >= total) {
              doLoop();
              lastRafTs = ts;
              rafId = requestAnimationFrame(rafTick);
              return;
            }
            applyMasterTime(next);
          }
        }
        lastRafTs = ts;
      }
      rafId = requestAnimationFrame(rafTick);
    }

    function startRaf() { if (!rafId) { lastRafTs = null; rafId = requestAnimationFrame(rafTick); } }
    function stopRaf()  { if (rafId) { cancelAnimationFrame(rafId); rafId = null; lastRafTs = null; } }

    function togglePlay() {
      if (renderPreviewLocked.value) return;
      const lv = lastVideo.value; const rv = refVideo.value;
      if (playing.value) {
        lv?.pause(); rv?.pause(); playing.value = false; stopRaf();
      } else {
        if (!lastEnded.value) lv?.play().catch(() => {});
        if (!refEnded.value)  rv?.play().catch(() => {});
        playing.value = true; startRaf();
      }
    }
    function pausePlayback() {
      if (!playing.value) return;
      lastVideo.value?.pause();
      refVideo.value?.pause();
      playing.value = false;
      stopRaf();
    }
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }
    function clientToVideoPoint(clientX, clientY) {
      const viewport = overlayViewport.value;
      if (!viewport) return null;
      const localX = clamp(clientX - viewport.leftPx, 0, viewport.widthPx);
      const localY = clamp(clientY - viewport.topPx, 0, viewport.heightPx);
      return {
        x: Math.round((localX / viewport.widthPx) * viewport.videoW),
        y: Math.round((localY / viewport.heightPx) * viewport.videoH),
      };
    }
    function pointInVideo(clientX, clientY) {
      const viewport = overlayViewport.value;
      if (!viewport) return false;
      return clientX >= viewport.leftPx && clientX <= viewport.leftPx + viewport.widthPx
          && clientY >= viewport.topPx && clientY <= viewport.topPx + viewport.heightPx;
    }
    function applyMeasureSnap(start, end, shiftKey) {
      if (!shiftKey) return end;
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      if (Math.abs(dx) >= Math.abs(dy)) return { x: end.x, y: start.y };
      return { x: start.x, y: end.y };
    }
    function pointNearMeasurement(clientX, clientY) {
      const viewport = overlayViewport.value;
      const measure = overlayMeasure.value;
      if (!viewport || !measure) return false;

      const x1 = viewport.leftPx + (measure.startX / viewport.videoW) * viewport.widthPx;
      const y1 = viewport.topPx + (measure.startY / viewport.videoH) * viewport.heightPx;
      const x2 = viewport.leftPx + (measure.endX / viewport.videoW) * viewport.widthPx;
      const y2 = viewport.topPx + (measure.endY / viewport.videoH) * viewport.heightPx;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      const hitRadius = 12;

      if (lenSq === 0) {
        const dist = Math.hypot(clientX - x1, clientY - y1);
        return dist <= hitRadius;
      }

      const t = clamp(((clientX - x1) * dx + (clientY - y1) * dy) / lenSq, 0, 1);
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      return Math.hypot(clientX - projX, clientY - projY) <= hitRadius;
    }
    function onOverlayPointerMove(e) {
      if (!overlayMeasure.value?.active) return;
      const point = clientToVideoPoint(e.clientX, e.clientY);
      if (!point) return;
      const snapped = applyMeasureSnap(
        { x: overlayMeasure.value.startX, y: overlayMeasure.value.startY },
        point,
        e.shiftKey
      );
      overlayMeasure.value = {
        ...overlayMeasure.value,
        endX: snapped.x,
        endY: snapped.y,
      };
    }
    function onOverlayPointerUp() {
      if (!overlayMeasure.value) return;
      overlayMeasure.value = { ...overlayMeasure.value, active: false };
      window.removeEventListener("pointermove", onOverlayPointerMove);
      window.removeEventListener("pointerup", onOverlayPointerUp);
    }
    function onOverlayPointerDown(e) {
      if (renderPreviewLocked.value) return;
      if (mode.value !== "overlay" || !pointInVideo(e.clientX, e.clientY)) return;
      if (overlayMeasure.value && !overlayMeasure.value.active && !pointNearMeasurement(e.clientX, e.clientY)) {
        overlayMeasure.value = null;
        return;
      }
      const point = clientToVideoPoint(e.clientX, e.clientY);
      if (!point) return;
      overlayMeasure.value = {
        startX: point.x,
        startY: point.y,
        endX: point.x,
        endY: point.y,
        active: true,
      };
      window.addEventListener("pointermove", onOverlayPointerMove);
      window.addEventListener("pointerup", onOverlayPointerUp);
    }
    async function copyMeasurementValue() {
      const value = overlayMeasurement.value?.value;
      if (value == null) return;
      const text = `${value} px`;
      await copyText(text);
    }
    async function copyEaseValues() {
      const text = [
        `In Influence: ${clampedEaseInX.value}`,
        `In Speed: ${clampedEaseInY.value}`,
        `Out Influence: ${clampedEaseOutX.value}`,
        `Out Speed: ${clampedEaseOutY.value}`,
        `Duration: ${clampedEaseDuration.value}ms`,
        ``,
        `In → KeyframeEase(speed=${clampedEaseInY.value}, influence=${clampedEaseInX.value})`,
        `Out → KeyframeEase(speed=${clampedEaseOutY.value}, influence=${clampedEaseOutX.value})`,
      ].join("\n");
      await copyText(text);
    }
    async function refreshOpenProjects() {
      const data = await fetch("/api/open-projects").then(r => r.json()).catch(() => []);
      openProjects.value = data;
    }
    const currentOpenRenderStatus = computed(() => currentOpenRenderJob.value?.status || "");
    const currentOpenRenderLabel = computed(() => {
      const job = currentOpenRenderJob.value;
      if (!job) return "render";
      if (job.status === "running" && job.stage === "frame_rendering") return "frame...";
      if (job.status === "running" && job.stage === "video_rendering") return "video...";
      if (job.status === "running" && job.stage === "build") return "build...";
      if (job.status === "running") return "rendering...";
      if (job.status === "done")    return "done ✓";
      if (job.status === "error")   return "error";
      return "render";
    });
    function stopRenderPoll(aepPath) {
      const poll = renderPollTimers.get(aepPath);
      if (!poll) return;
      clearInterval(poll);
      renderPollTimers.delete(aepPath);
    }
    function stopAllRenderPolls() {
      for (const [aepPath, poll] of renderPollTimers.entries()) {
        clearInterval(poll);
        renderPollTimers.delete(aepPath);
      }
    }
    function applyOpenRenderJob(aepPath, safeName, next) {
      const prev = openRenderJobs[aepPath] || {};
      const job = {
        ...prev,
        ...next,
        outputName: safeName,
        framePath: next.framePath || prev.framePath || `/output/${safeName}_current_frame.png`,
      };
      const becameFrameReady = !prev.frameReady && !!job.frameReady;
      openRenderJobs[aepPath] = job;
      if (becameFrameReady && job.status === "running") {
        pausePlayback();
        lastDur.value = 0;
        lastEnded.value = false;
        ts.value = Date.now();
      }
      if (job.status === "done") {
        openRenderedComp.value = safeName;
        lastRenderTime.value = new Date();
        ts.value = Date.now();
        stopRenderPoll(aepPath);
      } else if (job.status === "error") {
        stopRenderPoll(aepPath);
      }
    }
    async function refreshRenderJob(aepPath, safeName) {
      if (!aepPath || !safeName) return;
      const s = await fetch(`/api/render-status?name=${encodeURIComponent(safeName)}`).then(r => r.json()).catch(() => null);
      if (!s?.ok) return;
      applyOpenRenderJob(aepPath, safeName, {
        status: s.status,
        stage: s.stage,
        frameReady: s.frameReady,
        framePath: s.framePath,
        errorStage: s.errorStage,
      });
    }
    function startRenderPoll(aepPath, safeName) {
      stopRenderPoll(aepPath);
      const poll = setInterval(() => { refreshRenderJob(aepPath, safeName); }, 700);
      renderPollTimers.set(aepPath, poll);
    }
    function getCurrentRenderFrame() {
      if (duration.value <= 0) return 0;
      const maxT = Math.max(0, duration.value - 1 / FPS);
      const t = snapToFrame(Math.max(0, Math.min(currentTime.value || 0, maxT)));
      return tcFrames(t);
    }
    async function renderCurrentOpenProject() {
      const aepPath = openProjectPath.value;
      if (!aepPath) return;
      if (openRenderJobs[aepPath]?.status === "running") return;
      const comps = await fetch("/api/open-project-comps").then(r => r.json()).catch(() => []);
      const compName = comps[0];
      if (!compName) return;
      // output name matches what aep_to_mp4.sh actually produces (AEP basename without extension)
      const outputName = aepPath.split("/").pop().replace(/\.aep$/i, "");
      const frame = getCurrentRenderFrame();
      openRenderedComp.value = outputName;
      applyOpenRenderJob(aepPath, outputName, {
        status: "running",
        stage: "queued",
        frameReady: false,
      });
      const resp = await fetch("/api/render-open", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ aepPath, compName, outputName, frame }),
      }).then(r => r.json()).catch(() => ({ ok: false }));
      if (!resp.ok) {
        applyOpenRenderJob(aepPath, outputName, { status: "error", stage: "error", frameReady: false });
        return;
      }
      const safeName = resp.outputName;
      startRenderPoll(aepPath, safeName);
      refreshRenderJob(aepPath, safeName);
    }

    function stopAutoRender() {
      if (autoRenderTimer) { clearInterval(autoRenderTimer); autoRenderTimer = null; }
    }
    function toggleAutoRender() {
      autoRender.value = !autoRender.value;
    }
    watch(isOpenProject, v => {
      if (!v) { stopAutoRender(); openRenderedComp.value = ""; lastRenderTime.value = null; }
    });
    async function openAeProject() {
      if (!pairName.value) return;
      await fetch(`/api/open-aep?name=${encodeURIComponent(pairName.value)}`, { method: "POST" });
    }

    function onLastLoaded() {
      const v = lastVideo.value; if (!v) return;
      lastDur.value = v.duration; applySpeed(v);
      lastEnded.value = false;
      v.pause(); playing.value = false; stopRaf();
      layoutVersion.value += 1;
      ro?.observe(v);
      restorePlaybackPosition();
    }
    function onLastFrameLoaded() {
      const img = lastFrameImage.value; if (!img) return;
      lastDur.value = 0;
      lastEnded.value = false;
      layoutVersion.value += 1;
      ro?.observe(img);
    }
    function onRefLoaded() {
      const rv = refVideo.value; if (!rv) return;
      refNatDur.value = rv.duration;
      applySpeed(rv);
      rv.pause();
      refEnded.value = false;
      layoutVersion.value += 1;
      ro?.observe(rv);
      restorePlaybackPosition();
    }
    function onLastTime() {
      // no-op: timing is now driven by RAF master clock
    }
    function onRefTime() {
      // no-op
    }

    function fmtTime(t) {
      return `${tcSec(t)}s ${tcFr(t).toString().padStart(2, "0")}f`;
    }
    function fmt2(v) { return (Math.round((v || 0) * 100) / 100).toFixed(2); }
    function framesToSeconds(frames) {
      return Math.round(frames || 0) / FPS;
    }

    function onScrubStart(e) {
      if (renderPreviewLocked.value) return;
      pausePlayback();
      scrubTo(e);
      const onMove = e2 => scrubTo(e2);
      const onUp = () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
    }
    function scrubTo(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * duration.value;
      applyMasterTime(t);
    }

    // sidebar resize
    function onResizerDown(e) {
      resizing.value = true;
      const startX = e.clientX;
      const startW = sidebarWidth.value;
      const onMove = e2 => {
        const delta = startX - e2.clientX;
        sidebarWidth.value = Math.max(200, Math.min(600, startW + delta));
      };
      const onUp = () => {
        resizing.value = false;
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
      };
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
    }

    let es = null;
    async function fetchPairs() {
      const data = await fetch("/api/pairs").then(r => r.json());
      pairs.value = data;
      if (selected.value && !selected.value.startsWith("open:") && !data.includes(selected.value)) selected.value = "";
      if (!selected.value && data.length) selected.value = data[0];
    }
    function connectSSE() {
      es = new EventSource("/events");
      es.onmessage = (e) => {
        const data = e.data || "";
        if (data === "dev-reload") {
          location.reload();
        } else if (data.startsWith("aep-changed:")) {
          const changedPath = data.slice("aep-changed:".length);
          if (autoRender.value && openProjectPath.value === changedPath) {
            renderCurrentOpenProject();
          }
        } else if (data.startsWith("render-job:")) {
          const safeName = data.slice("render-job:".length);
          const aepPath = Object.keys(openRenderJobs).find(key => openRenderJobs[key]?.outputName === safeName);
          if (aepPath) refreshRenderJob(aepPath, safeName);
        } else {
          ts.value = Date.now();
          fetchPairs();
        }
      };
      es.onerror = () => { es.close(); setTimeout(connectSSE, 2000); };
    }

    function seek(delta) {
      if (renderPreviewLocked.value) return;
      const maxT = Math.max(0, duration.value - 1 / FPS);
      const t = snapToFrame(Math.max(0, Math.min(maxT, masterTime + delta)));
      applyMasterTime(t);
    }
    function goToStart() {
      if (renderPreviewLocked.value) return;
      pausePlayback();
      applyMasterTime(0);
    }
    function seekFrames(frames) {
      if (renderPreviewLocked.value) return;
      pausePlayback();
      seek(framesToSeconds(frames));
    }

    function onKeyDown(e) {
      if (renderPreviewLocked.value && (e.code === "Space" || e.code === "ArrowLeft" || e.code === "ArrowRight")) {
        e.preventDefault();
        return;
      }
      if (e.code === "Space") { e.preventDefault(); togglePlay(); return; }
      if (e.code === "ArrowLeft")  { e.preventDefault(); seekFrames(-seekStepFrames.value); return; }
      if (e.code === "ArrowRight") { e.preventDefault(); seekFrames(seekStepFrames.value); return; }
    }

    let ro = null;
    onMounted(() => {
      fetchPairs(); connectSSE();
      refreshOpenProjects();
      window.addEventListener("keydown", onKeyDown, true);
      ro = new ResizeObserver(updateEndedStyles);
    });
    onUnmounted(() => {
      es?.close();
      window.removeEventListener("keydown", onKeyDown, true);
      window.removeEventListener("pointermove", onOverlayPointerMove);
      window.removeEventListener("pointerup", onOverlayPointerUp);
      window.removeEventListener("pointermove", onAlignPointerMove);
      window.removeEventListener("pointerup", stopAlignDrag);
      window.removeEventListener("mousemove", onToolWindowDrag);
      window.removeEventListener("mouseup", stopToolWindowDrag);
      window.removeEventListener("pointermove", onEaseHandlePointerMove);
      window.removeEventListener("pointerup", stopEaseHandleDrag);
      window.removeEventListener("pointerdown", onColorPickerPointerDown, true);
      stopRaf();
      stopAutoRender();
      stopAllRenderPolls();
      ro?.disconnect();
    });

    return {
      pairs, selected, openProjects, openProjectComps, selectedOpenComp, openRenderJobs,
      isOpenProject, pairName, videoName, openProjectPath,
      currentOpenRenderStatus, currentOpenRenderLabel, showFramePreview, renderPreviewLocked, renderStatusBadge, frameSrc,
      autoRender, lastRenderLabel, now,
      refreshOpenProjects, renderCurrentOpenProject, toggleAutoRender,
      trimStart, trimDur, speeds, speed, setSpeed, seekStepFrames,
      FPS, tcSec, tcFr, tcToSec, setTrimStart, setTrimDur,
      mode, setMode, showGrid, sidebarOpen, sidebarWidth, resizing, onResizerDown,
      alignLayers, alignFilterOptions, alignTarget, alignTopLayer, alignOpacity, alignFilter,
      alignDragging, setAlignTarget, setAlignTopLayer, setAlignOpacity, setAlignFilter,
      alignLayerStyle, onAlignPointerDown,
      lastSrc, refSrc, refKey, lastVideo, lastFrameImage, refVideo,
      playing, currentTime, duration, progressPct, overlayGrid, overlayMeasurement,
      lastEnded, refEnded, lastEndedStyle, refEndedStyle,
      toolsMenuOpen, toolWindows, easeTool, easeGraph, easePreview, colorPickerTool, colorPickerActive,
      togglePlay, goToStart, seekFrames, onLastLoaded, onLastFrameLoaded, onRefLoaded, onLastTime, onRefTime,
      onOverlayPointerDown, copyMeasurementValue, openAeProject,
      openToolWindow, closeToolWindow, focusToolWindow, startToolWindowDrag,
      easeDragHandle, startEaseHandleDrag, onEaseGraphPointerDown, replayEasePreview, copyEaseValues, copyColorPickerValue,
      fmtTime, fmt2, onScrubStart,
    };
  }
}).mount("#app");
</script>
</body>
